name: Bug report
description: Report a reproducible reader problem
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Expected behavior, actual behavior, and steps to reproduce. Do not include private books or credentials.
    validations:
      required: true
  - type: input
    attributes:
      label: Firmware commit and board revision
    validations:
      required: true
  - type: textarea
    attributes:
      label: Checks and sample
      description: Rotation, font/size, development mode, and an original or freely licensed minimal sample.
